# Dex: standalone OpenID Connect provider with a built-in user list.
# All passwords below are "password".
issuer: https://dex.localhost:8443

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: ctfd
    name: CTFd
    secret: ctfd-dev-secret
    redirectURIs:
      - https://ctfd.localhost:8443/auth_tools/oidc/callback

enablePasswordDB: true
staticPasswords:
